<!doctype html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecuaciones con decimales</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2328; --muted: #5f6670; --line: #e3dfd6;
    --accent: #2f6fdb; --accent-soft: #e8f0fd; --ok: #1e7a46; --ok-soft: #e4f4ea;
    --bad: #b3261e; --bad-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fdf3dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 16px 16px 80px; }
  header h1 { font-size: 28px; margin: 8px 0 2px; outline: none; border-bottom: 2px dashed transparent; display: inline-block; }
  header h1:hover, header h1:focus { border-bottom-color: var(--line); }
  header h1:empty::before { content: "Tocá acá y ponele nombre"; color: var(--muted); }
  header p { margin: 0 0 14px; color: var(--muted); font-size: 16px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  nav button { border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: 16px; cursor: pointer; min-height: 44px; }
  nav button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  nav button .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
  h2 { font-size: 24px; margin: 6px 0 4px; }
  h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 26px 0 8px; }
  .meta { color: var(--muted); font-size: 15px; margin-bottom: 10px; }
  .intro { background: var(--card); border-radius: 18px; padding: 14px 18px; border: 1px solid var(--line); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin: 12px 0; }
  .card.ok { border-color: #9fd3b4; }
  .lbl { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .eq { font-size: 23px; font-family: "Cambria Math", Cambria, Georgia, serif; margin: 2px 0 10px; overflow-x: auto; white-space: nowrap; }
  .rad { white-space: nowrap; }
  .rad .ov { border-top: 1.5px solid currentColor; padding: 0 2px; }
  .rad sup { font-size: .6em; margin-right: -2px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row label { font-family: Georgia, serif; font-size: 20px; }
  input.ans { font: inherit; font-size: 20px; width: 150px; padding: 8px 10px; border-radius: 12px;
    border: 1.5px solid var(--line); min-height: 44px; }
  input.ans:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .btn { font: inherit; font-size: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    padding: 8px 14px; cursor: pointer; min-height: 44px; }
  .btn.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .fb { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 16px; }
  .fb.ok { background: var(--ok-soft); color: var(--ok); }
  .fb.bad { background: var(--bad-soft); color: var(--bad); }
  .hint { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 16px; }
  .steps { margin: 10px 0 0; padding: 10px 14px 10px 34px; background: var(--accent-soft); border-radius: 12px;
    font-family: "Cambria Math", Cambria, Georgia, serif; font-size: 19px; }
  .arranque { font-size: 15px; color: var(--muted); margin: -4px 0 10px; }
  .arranque .eqi { font-family: Georgia, serif; color: var(--ink); font-size: 18px; }
  .ejemplo .steps { list-style: none; padding-left: 14px; }
  .linea { display: block; width: 100%; text-align: left; font: inherit; font-family: "Cambria Math", Cambria, Georgia, serif;
    font-size: 20px; background: none; border: 1px solid transparent; border-radius: 10px; padding: 6px 10px; cursor: pointer; min-height: 44px; }
  .linea:hover { background: var(--accent-soft); }
  .linea.no { background: var(--bad-soft); text-decoration: line-through; }
  .linea.si { background: var(--ok-soft); }
  .tools { display: grid; gap: 12px; }
  .tools ul { margin: 6px 0 0; padding-left: 20px; }
  .tools li { margin: 4px 0; }
  .semaforo { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .semaforo button.on { outline: 3px solid var(--ink); }
  .vacio { color: var(--muted); font-style: italic; }
  footer { margin-top: 36px; color: var(--muted); font-size: 14px; }
  @media print {
    nav, .btn, .fb, .hint, .steps:not(.keep), footer, .semaforo, .noprint { display: none !important; }
    body { background: #fff; font-size: 14px; }
    .card, .intro { border: none; padding: 6px 0; break-inside: avoid; }
    input.ans { border: none; border-bottom: 1px solid #000; border-radius: 0; }
    .eq { font-size: 18px; }
    .ejemplo .steps { display: block !important; background: none; }
  }
</style>
</head>

const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: d64(C.sal), iterations: C.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: d64(C.iv) }, key, d64(C.data));
  const flujo = new Blob([plano]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(flujo).text();
}
async function entrar(clave, recordar) {
  try {
    const codigo = await abrir(clave);
    if (recordar) { try { localStorage.setItem("guia-clave", clave); } catch (e) {} }
    document.getElementById("puerta").remove();
    document.querySelector(".wrap").style.display = "";
    const s = document.createElement("script"); s.textContent = codigo; document.body.appendChild(s);
    return true;
  } catch (e) { return false; }
}
document.querySelector(".wrap").style.display = "none";
document.getElementById("fclave").onsubmit = async ev => {
  ev.preventDefault();
  const ok = await entrar(document.getElementById("clave").value.trim().toLowerCase(), true);
  if (!ok) document.getElementById("msg").textContent = "Esa clave no es. Probá de nuevo.";
};
(async () => { let g = null; try { g = localStorage.getItem("guia-clave"); } catch (e) {}
  if (g && !(await entrar(g, false))) { try { localStorage.removeItem("guia-clave"); } catch (e) {} } })();
